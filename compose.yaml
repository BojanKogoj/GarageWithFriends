services:
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ${DATA_ROOT:?set DATA_ROOT in .env}/garage/meta:/var/lib/garage/meta
      - ${DATA_ROOT:?set DATA_ROOT in .env}/garage/data:/var/lib/garage/data
    network_mode: service:tailscale
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    container_name: webui
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "3909:3909"
    environment:
      - API_BASE_URL=http://garage:3903
      - S3_ENDPOINT_URL=http://garage:3900

  tailscale:
    image: tailscale/tailscale:v1.102.5
    container_name: tailscale
    hostname: garage
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--login-server=${TS_LOGIN_SERVER:?set TS_LOGIN_SERVER in .env}
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT in .env}/tailscale:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW

  newt:
    image: fosrl/newt:1.18.1
    container_name: newt
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}